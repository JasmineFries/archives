<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题目答案集</title>
  <style>
    :root {
      --bg: #f7fffc;
      --paper: #ffffff;
      --text: #173634;
      --muted: #637c79;
      --line: #d2eee8;
      --line-strong: #90ddcf;
      --blue: #0b91d1;
      --cyan: #10abc0;
      --mint: #4bd89d;
      --mint-soft: #eafff5;
      --code-bg: #0e2529;
      --code-head: #14353b;
      --code-text: #eafff8;
      --shadow: 0 14px 36px rgba(11, 145, 209, .10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, #fff 0%, var(--bg) 52%, #f0fff8 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 20px 16px;
      background: rgba(255, 255, 255, .9);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .brand {
      padding: 8px 8px 16px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0 0 6px;
      color: #08728a;
      font-size: 22px;
      letter-spacing: 0;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .search-box {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 4px 0 12px;
      background: rgba(255, 255, 255, .96);
    }

    .search-box label {
      display: block;
      margin: 0 0 6px 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fbfffd;
    }

    .search-row svg { color: var(--cyan); flex: 0 0 auto; }

    #searchInput {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .stats {
      margin: 8px 2px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .toc {
      display: grid;
      gap: 6px;
    }

    .toc a {
      display: block;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #174446;
      text-decoration: none;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .toc a:hover {
      border-color: var(--line-strong);
      background: var(--mint-soft);
      color: #056f84;
    }

    main {
      width: min(1060px, 100%);
      margin: 0 auto;
      padding: 32px 28px 56px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .problem {
      margin: 0 0 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .problem-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, #eafeff 0%, #f1fff8 100%);
    }

    .problem h2 {
      margin: 0;
      color: #075f77;
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .problem-body {
      display: grid;
      gap: 16px;
      padding: 18px 20px 22px;
    }

    .part {
      overflow: hidden;
      border: 1px solid #e1f5ef;
      border-radius: var(--radius);
      background: #fff;
    }

    .part-title {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid #e1f5ef;
      background: #f4fffb;
      color: #087c8f;
      font-size: 16px;
    }

    .content {
      padding: 12px;
      overflow-wrap: anywhere;
    }

    .content h3 {
      margin: 18px 0 8px;
      color: #0a8b85;
      font-size: 15px;
    }

    .content h3:first-child { margin-top: 0; }
    .content p { margin: 0 0 10px; white-space: pre-wrap; }
    .content a { color: #087fb2; word-break: break-all; }

    .code-wrap {
      margin: 12px 0;
      overflow: hidden;
      border: 1px solid #17474d;
      border-radius: var(--radius);
      background: var(--code-bg);
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      background: var(--code-head);
      color: #b7fff0;
      font-size: 12px;
    }

    .copy-btn, .top-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid #9be9db;
      border-radius: 6px;
      background: #ecfff8;
      color: #06737a;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .copy-btn:hover, .top-btn:hover { background: #d9fff0; }

    pre {
      margin: 0;
      padding: 14px;
      overflow: auto;
      color: var(--code-text);
      font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre;
    }

    mark {
      padding: 0 2px;
      border-radius: 3px;
      background: #cdfce8;
      color: #0b3c40;
    }

    .empty {
      display: none;
      padding: 36px 20px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .72);
      color: var(--muted);
      text-align: center;
    }

    .back-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 4;
      box-shadow: 0 10px 24px rgba(5, 116, 130, .16);
    }

    @media (max-width: 860px) {
      .app { display: block; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .toc { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
      main { padding: 22px 14px 72px; }
      .problem h2 { font-size: 19px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app" id="top">
    <aside class="sidebar">
      <div class="brand">
        <h1>题目答案集</h1>
        <p>原题、思路、代码，一页看完。</p>
      </div>
      <div class="search-box">
        <label for="searchInput">搜索题目或答案</label>
        <div class="search-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="例如：栈、BFS、最小生成树、陈氏素数">
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <nav class="toc" id="toc" aria-label="题目目录"></nav>
    </aside>
    <main>
      <div class="toolbar">
        <span class="pill" id="summary"></span>
        <span class="pill">答案代码可一键复制</span>
      </div>
      <div id="problems"></div>
      <div class="empty" id="empty">没有找到匹配内容，换个关键词试试。</div>
    </main>
  </div>
  <button class="top-btn back-top" type="button" onclick="document.getElementById('top').scrollIntoView()">返回顶部</button>

    function decodeMarkdown(base64) {
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes).replace(/\r\n/g, "\n");
    }

    const source = decodeMarkdown(encodedMarkdown);
    const problemMatches = [...source.matchAll(/^## 问题 ([A-Z])[:：].*$/gm)];
    const problems = problemMatches.map((match, index) => {
      const start = match.index;
      const end = index + 1 < problemMatches.length ? problemMatches[index + 1].index : source.length;
      const block = source.slice(start, end).trim();
      const title = match[0].replace(/^##\s*/, "").trim();
      const body = block.replace(/^## .*\n?/, "").trim();
      const parts = body.split(/^### 答案\s*$/m);
      const question = (parts[0] || "").replace(/^### 原题\s*/m, "").trim();
      const answer = (parts[1] || "").trim();
      return {
        id: "problem-" + match[1],
        letter: match[1],
        title,
        question,
        answer,
        text: (title + "\n" + question + "\n" + answer).toLowerCase()
      };
    });

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(html, query) {
      if (!query) return html;
      const re = new RegExp("(" + escapeRegExp(query) + ")", "gi");
      return html.replace(re, "<mark>$1</mark>");
    }

    function inlineLinks(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/https?:\/\/[^\s<]+/g, url => '<a href="' + url + '" target="_blank" rel="noreferrer">' + url + '</a>');
    }

    function renderMarkdown(md, query) {
      const parts = md.split(/```(\w+)?\n([\s\S]*?)```/g);
      let html = "";
      for (let i = 0; i < parts.length; i++) {
        if (i % 3 === 0) {
          const text = parts[i].trim();
          if (!text) continue;
          const lines = text.split("\n");
          let paragraph = [];
          const flush = () => {
            if (!paragraph.length) return;
            const joined = paragraph.join("\n");
            html += "<p>" + highlight(inlineLinks(joined), query) + "</p>";
            paragraph = [];
          };
          for (const line of lines) {
            if (/^###\s+/.test(line)) {
              flush();
              html += "<h3>" + highlight(escapeHtml(line.replace(/^###\s+/, "")), query) + "</h3>";
            } else if (line.trim() === "---") {
              flush();
            } else {
              paragraph.push(line);
            }
          }
          flush();
        } else if (i % 3 === 1) {
          const lang = parts[i] || "code";
          const code = parts[i + 1] || "";
          const codeId = window.__codeStore.push(code) - 1;
          html += '<div class="code-wrap"><div class="code-head"><span>' + escapeHtml(lang || "code") + '</span><button class="copy-btn" type="button" data-code-id="' + codeId + '">复制代码</button></div><pre><code>' + escapeHtml(code) + "</code></pre></div>";
          i++;
        }
      }
      return html;
    }

    function render(query) {
      const rawQuery = query || "";
      const q = rawQuery.trim().toLowerCase();
      const visible = problems.filter(p => !q || p.text.includes(q));
      const toc = document.getElementById("toc");
      const container = document.getElementById("problems");
      window.__codeStore = [];
      toc.innerHTML = visible.map(p => '<a href="#' + p.id + '">' + escapeHtml(p.title) + "</a>").join("");
      container.innerHTML = visible.map(p => `
        <article class="problem" id="${p.id}">
          <div class="problem-header"><h2>${highlight(escapeHtml(p.title), rawQuery)}</h2></div>
          <div class="problem-body">
            <section class="part">
              <h3 class="part-title">原题</h3>
              <div class="content">${renderMarkdown(p.question, rawQuery)}</div>
            </section>
            <section class="part">
              <h3 class="part-title">答案</h3>
              <div class="content">${renderMarkdown(p.answer, rawQuery)}</div>
            </section>
          </div>
        </article>
      `).join("");
      document.getElementById("stats").textContent = q ? "找到 " + visible.length + " / " + problems.length + " 题" : "共 " + problems.length + " 题";
      document.getElementById("summary").textContent = q ? "搜索：" + rawQuery : "共 " + problems.length + " 题，离线可查看";
      document.getElementById("empty").style.display = visible.length ? "none" : "block";
    }

    document.addEventListener("click", async event => {
      const btn = event.target.closest(".copy-btn");
      if (!btn) return;
      const codeId = Number(btn.getAttribute("data-code-id"));
      const code = window.__codeStore[codeId] || "";
      try {
        await navigator.clipboard.writeText(code);
        const old = btn.textContent;
        btn.textContent = "已复制";
        setTimeout(() => btn.textContent = old, 1200);
      } catch {
        const box = document.createElement("textarea");
        box.value = code;
        document.body.appendChild(box);
        box.select();
        document.execCommand("copy");
        box.remove();
        btn.textContent = "已复制";
        setTimeout(() => btn.textContent = "复制代码", 1200);
      }
    });

    document.getElementById("searchInput").addEventListener("input", event => render(event.target.value));
    render("");
  </script>
